<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VEGAS — Estúdio de jogos</title>
<meta name="description" content="Site Vegas studio"/>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="space.css" />
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html#home"><span class="star-halo" aria-hidden="true"></span><span class="logo-txt">VEGAS</span></a>
  <nav class="main-nav" id="mainNav">
    <a href="index.html#home">INICIO</a>
    <a href="historia.html">QUEM SOMOS?</a>
    <a href="release.html">PROJETOS</a>
  </nav>
  <button class="burger" id="burger" aria-label="Abrir menu"><span></span><span></span><span></span></button>
</header>

<main id="home">
  <!-- BANNER INTERATIVO -->
  <section class="banner" id="banner" aria-label="Destaques">
    <div class="slides" id="slides">
      <!-- painéis injetados via JS -->
    </div>

    <div class="banner-ui">
      <button class="arrow prev" id="prev" aria-label="Anterior">&#10094;</button>
      <button class="arrow next" id="next" aria-label="Próximo">&#10095;</button>
      <div class="dots" id="dots"></div>
      <div class="progress"><span id="progressBar"></span></div>

      <div class="banner-info" id="bannerInfo"></div>
    </div>
  </section>
</main>

<footer id="footer">
  <div class="foot-inner">
    <p class="logo small"><span class="star-halo" aria-hidden="true"></span><span class="logo-txt">VEGAS</span></p>
    <p class="copy">© 2026 Projeto demonstrativo. Site fictício inspirado no layout da VEGAS.</p>
  </div>
</footer>

<div class="cookie" id="cookie">
  <p>Este site usa cookies para melhorar a experiência de navegação.</p>
  <button id="acceptCookie">Aceitar</button>
</div>

<script src="space.js"></script>
<script src="nav.js"></script>
<script src="script.js"></script>
</body>
</html>
